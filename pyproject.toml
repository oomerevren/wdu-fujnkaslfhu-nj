[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentestai"
version = "1.0.0"
description = "PentestAI — AI Destekli Otonom Siber Güvenlik Platformu"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
keywords = ["pentest", "security", "ai", "saas", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "aio-pika>=9.4.0",
    "stripe>=7.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "docker>=7.0.0",
    "loguru>=0.7.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "neo4j>=5.20.0",
    "weasyprint>=60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "httpx>=0.27.0",
    "testcontainers>=4.0.0",
    "bandit>=1.7.0",
    "safety>=3.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-redis",
    "types-pyyaml",
]

[project.scripts]
pentestai-cli = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "sdk*", "cli*", "tests*"]
exclude = ["tests*", ".git*", "build*", "dist*", "__pycache__*"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", "__pycache__", "build", "dist", ".venv", ".env"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html --asyncio-mode=auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["tests/*", ".venv/*", ".env/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
