# =============================================================================
# PentestAI — Production Docker Compose
# =============================================================================
# Kullanım:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *restart-policy
      neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/pentestai-neo4j-secret
    networks:
      - pentestai-net

volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: &db_user ${POSTGRES_USER:-pentestai}
      POSTGRES_PASSWORD: &db_password ${POSTGRES_PASSWORD:-pentestai}
      POSTGRES_DB: &db_name ${POSTGRES_DB:-pentestai}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentestai} -d ${POSTGRES_DB:-pentestai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - pentestai-net

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    <<: *restart-policy
    