# =============================================================================
# PentestAI — Production Docker Compose
# =============================================================================
# Kullanım:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs -f
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart-policy: &restart-policy
  restart: unless-stopped

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: *restart-policy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: &db_user ${POSTGRES_USER:-pentestai}
      POSTGRES_PASSWORD: &db_password ${POSTGRES_PASSWORD:-pentestai}
      POSTGRES_DB: &db_name ${POSTGRES_DB:-pentestai}
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentestai} -d ${POSTGRES_DB:-pentestai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - pentestai-net

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    <<: *restart-policy
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - pentestai-net

  # ─── RabbitMQ ────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    <<: *restart-policy
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pentestai}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-pentestai}
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - pentestai-net

  # ─── FastAPI Application ─────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pentestai:${BUILD_TAG:-latest}
    <<: *restart-policy
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENV=production
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging: *default-logging
    networks:
      - pentestai-net

  # ─── Celery Worker ───────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: pentestai-worker:${BUILD_TAG:-latest}
    <<: *restart-policy
    env_file:
      - .env
    environment:
      - ENV=production
      - DEBUG=false
      - CELERY_WORKER_CONCURRENCY=${CELERY_WORKER_CONCURRENCY:-4}
      - CELERY_WORKER_QUEUES=scans,default
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: ${CELERY_WORKER_REPLICAS:-2}
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      disable: true  # Celery healthcheck is done via the CMD itself
    logging: *default-logging
    networks:
      - pentestai-net

  # ─── Celery Beat (Scheduler) ─────────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: pentestai-worker:${BUILD_TAG:-latest}
    <<: *restart-policy
    env_file:
      - .env
    environment:
      - ENV=production
      - DEBUG=false
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pentestai-net

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    <<: *restart-policy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    logging: *default-logging
    networks:
      - pentestai-net
      - pentestai-public

# ─── Volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  nginx_logs:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────
networks:
  pentestai-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
  pentestai-public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
