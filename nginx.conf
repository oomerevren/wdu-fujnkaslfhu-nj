# =============================================================================
# PentestAI — Production Nginx Configuration
# =============================================================================
# This config is designed to be mounted into an nginx:alpine container.
# Place SSL certificates in ./ssl/ directory relative to docker-compose.
# =============================================================================

# ─── Global Settings ─────────────────────────────────────────────────────────
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    multi_accept on;
    worker_connections 65535;
    use epoll;
}

http {
    # ── Basic Settings ────────────────────────────────────────────────────
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    log_not_found off;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ── MIME Types ────────────────────────────────────────────────────────
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Rate Limiting Zones ───────────────────────────────────────────────
    # API: 30 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    # Auth: 5 requests per minute per IP (stricter)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    # Health check: 60 requests per minute
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=60r/m;
    # Burst protection
    limit_req_status 429;
    limit_conn_status 429;

    # ── Connection Limiting ───────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # ── SSL Settings ──────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security Headers (default, inherited by all server blocks) ────────
    # More specific headers can be set per-location if needed
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'" always;

    # ── Gzip Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ── Logging Format (JSON) ─────────────────────────────────────────────
    log_format json_combined escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id"'
    '}';

    access_log /var/log/nginx/access.log json_combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ── Upstream: PentestAI Backend ───────────────────────────────────────
    upstream pentestai_backend {
        zone upstream_pentestai 64k;
        server app:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ── Upstream: WebSocket support for future use ────────────────────────
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # ======================================================================
    # HTTP Server → Redirect to HTTPS
    # ======================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME challenge (Let's Encrypt) — must be accessible on port 80
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            try_files $uri =404;
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ======================================================================
    # HTTPS Server (Main)
    # ======================================================================
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name api.pentestai.com;

        # ── SSL Certificates ─────────────────────────────────────────────
        # Production: Use Let's Encrypt (certbot) or your own CA
        # For docker-compose, mount ./ssl/ to /etc/nginx/ssl/
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ── Root for Let's Encrypt renewal ───────────────────────────────
        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }

        # ── API Proxy ────────────────────────────────────────────────────
        location /api/v1/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn addr 10;

            proxy_pass http://pentestai_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;

            # Proxy buffers
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 8k;
            proxy_busy_buffers_size 16k;
            proxy_max_temp_file_size 0;
        }

        # ── Auth Endpoints (Stricter Rate Limiting) ──────────────────────
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn addr 3;

            proxy_pass http://pentestai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 30s;
        }

        # ── Health Check (No Rate Limiting) ──────────────────────────────
        location /health {
            limit_req zone=health_limit burst=10 nodelay;
            access_log off;

            proxy_pass http://pentestai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 5s;
        }

        # ── Metrics (Internal Network Only) ──────────────────────────────
        location /metrics {
            # Allow only internal IPs
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://pentestai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── API Documentation ────────────────────────────────────────────
        location /docs {
            proxy_pass http://pentestai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://pentestai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://pentestai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Static Files ─────────────────────────────────────────────────
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable, max-age=2592000";
            access_log off;
        }

        # ── Public Files ─────────────────────────────────────────────────
        location /public/ {
            alias /app/public/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # ── Root → Redirect to docs ──────────────────────────────────────
        location = / {
            return 302 /docs;
        }

        # ── Deny Sensitive Files ─────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /\.env {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ /\.git {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* (?:\.(?:bak|cfg|conf|db|dist|fla|inc|ini|log|old|orig|po|psd|sh|sql|swp|temp|txt|yml|yaml))$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ── Fallback ─────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
